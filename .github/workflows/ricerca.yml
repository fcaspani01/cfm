# Ricerca di design: gira solo sul branch ricerca-design e salva i risultati in research/out
name: Ricerca design

on:
  push:
    branches: [ricerca-design]
    paths: ["research/config.json", "research/run.py"]

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright requests pillow && python -m playwright install --with-deps chromium >/dev/null
      - run: rm -rf research/out && python research/run.py
      - name: Salva risultati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/out
          git commit -qm "Risultati ricerca design" && git push
